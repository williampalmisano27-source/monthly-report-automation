[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monthly-report-automation"
version = "0.1.0"
description = "Validated Excel material-report rollover with an auditable CSV summary"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<3.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
report-rollover = "report_rollover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

